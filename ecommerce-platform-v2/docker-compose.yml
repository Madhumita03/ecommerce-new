# =============================================================================
# Docker Compose – ShopEase E-Commerce Platform
# Spring Boot 3.5 | Java 21 | Virtual Threads | SLF4J/Logback | JUnit5/Mockito5
# =============================================================================

networks:
  backend:  { driver: bridge }
  monitoring: { driver: bridge }

volumes:
  pg_primary0_data:
  pg_primary1_data:
  pg_orders_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  es_data:
  prometheus_data:
  grafana_data:

services:

  # ── PostgreSQL Shard 0 ────────────────────────────────────────────────────
  postgres-primary0:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce_shard0
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_primary0_data:/var/lib/postgresql/data
      - ./infra/postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    ports: ["5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecommerce -d ecommerce_shard0"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-primary1:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: ecommerce_shard1, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: secret }
    volumes: [pg_primary1_data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecommerce -d ecommerce_shard1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-orders:
    # NOTE: pgvector/pgvector is a drop-in replacement for the official postgres image
    # with the `vector` extension pre-installed. ai-service runs CREATE EXTENSION
    # IF NOT EXISTS vector at startup against the ecommerce_ai database.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_MULTIPLE_DATABASES: "ecommerce_orders,ecommerce_users,ecommerce_payments,ecommerce_urls,ecommerce_ai"
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
      - ./infra/postgres/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
    ports: ["5435:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [backend]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s }

  # ── Zookeeper + Kafka ─────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    volumes: [zookeeper_data:/var/lib/zookeeper/data]
    networks: [backend]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafka_data:/var/lib/kafka/data]
    ports: ["29092:29092"]
    networks: [backend]
    healthcheck:
      test: ["CMD","kafka-topics","--bootstrap-server","localhost:9092","--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    depends_on: { kafka: { condition: service_healthy } }
    command: |
      bash -c "
        for t in product-events order-events stock-events payment-events payment-result-events notification-events competitor-price-events; do
          kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic $$t
        done
        echo 'Kafka topics created.'
      "
    networks: [backend]

  # ── Elasticsearch ─────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes: [es_data:/usr/share/elasticsearch/data]
    ports: ["9200:9200"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-orders:5432/keycloak
      KC_DB_USERNAME: ecommerce
      KC_DB_PASSWORD: secret
    volumes:
      - ./infra/keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json
    ports: ["8180:8080"]
    depends_on: { postgres-orders: { condition: service_healthy } }
    networks: [backend]

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api-gateway, notification-service]
    networks: [backend]

  # ── Eureka ────────────────────────────────────────────────────────────────
  # NOTE: the old `springcloud/eureka` image on Docker Hub uses a deprecated
  # v1+prettyjws manifest that containerd 2.1+ refuses to pull. We use the
  # maintained Steeltoe image which exposes the standard Spring Cloud Netflix
  # Eureka Server on port 8761.
  eureka:
    image: steeltoeoss/eureka-server:latest
    ports: ["8761:8761"]
    networks: [backend]

  # ── Prometheus + Grafana ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    networks: [backend, monitoring]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [monitoring]

  # ── Microservices ─────────────────────────────────────────────────────────
  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: api-gateway } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecommerce
      EUREKA_URL: http://eureka:8761
    ports: ["8080:8080"]
    depends_on: { redis: { condition: service_healthy } }
    networks: [backend]
    mem_limit: 512m

  product-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: product-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PRIMARY0_HOST: postgres-primary0
      DB_PRIMARY1_HOST: postgres-primary1
      DB_REPLICA0_HOST: postgres-primary0   # dev: replicas point to primary
      DB_REPLICA1_HOST: postgres-primary1
      DB_USER: ecommerce
      DB_PASS: secret
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      EUREKA_URL: http://eureka:8761
    depends_on:
      postgres-primary0: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [backend]

  order-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: order-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASS: secret
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      EUREKA_URL: http://eureka:8761
      SERVICES_PRODUCT_URL: http://product-service:8081
    depends_on:
      postgres-orders: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_started }
    networks: [backend]

  user-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: user-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASS: secret
      KEYCLOAK_URL: http://keycloak:8080
      EUREKA_URL: http://eureka:8761
    depends_on: { postgres-orders: { condition: service_healthy } }
    networks: [backend]

  notification-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: notification-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BROKERS: kafka:9092
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EUREKA_URL: http://eureka:8761
    ports: ["8088:8088"]
    depends_on: { kafka: { condition: service_healthy } }
    networks: [backend]

  url-shortener-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: url-shortener-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASS: secret
      REDIS_HOST: redis
      EUREKA_URL: http://eureka:8761
    depends_on:
      postgres-orders: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

  search-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: search-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ELASTICSEARCH_URI: http://elasticsearch:9200
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      EUREKA_URL: http://eureka:8761
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

  ai-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: ai-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASS: secret
      REDIS_HOST: redis
      EUREKA_URL: http://eureka:8761
    depends_on:
      postgres-orders: { condition: service_healthy }
    networks: [backend]

  payment-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: payment-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-orders
      DB_PORT: 5432
      DB_USER: ecommerce
      DB_PASS: secret
      KAFKA_BROKERS: kafka:9092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      KEYCLOAK_URL: http://keycloak:8080
      EUREKA_URL: http://eureka:8761
    depends_on:
      postgres-orders: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [backend]

  crawler-service:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: crawler-service } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BROKERS: kafka:9092
      EUREKA_URL: http://eureka:8761
    depends_on: { kafka: { condition: service_healthy } }
    networks: [backend]
