worker_processes auto;
events { worker_connections 4096; }
http {
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status}';
  access_log /var/log/nginx/access.log json_combined;
  gzip on;
  gzip_types text/plain application/json;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  upstream api_gateway { least_conn; server api-gateway:8080; keepalive 32; }
  server {
    listen 80;
    add_header X-Frame-Options DENY always;
    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
    location /ws {
      proxy_pass http://notification-service:8088;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_read_timeout 3600s;
    }
    location /health { proxy_pass http://api_gateway/actuator/health; access_log off; }
  }
}
