global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["api-gateway:8080"] }]
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["product-service:8081"] }]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["order-service:8082"] }]
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["user-service:8083"] }]
  - job_name: url-shortener
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["url-shortener-service:8085"] }]
  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["search-service:8086"] }]
  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["ai-service:8087"] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification-service:8088"] }]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["payment-service:8090"] }]
  - job_name: crawler-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["crawler-service:8089"] }]
