server:
  port: 8090
spring:
  application:
    name: payment-service
    group: ecommerce-platform
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/ecommerce_payments
    username: ${DB_USER:ecommerce}
    password: ${DB_PASS:secret}
  jpa.hibernate.ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties.enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2.resourceserver.jwt:
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ecommerce}/protocol/openid-connect/certs
payment.stripe.secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka/
management:
  endpoints.web.exposure.include: health, prometheus
