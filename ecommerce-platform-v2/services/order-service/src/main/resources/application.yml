server:
  port: 8082
spring:
  application:
    name: order-service
    group: ecommerce-platform
  threads.virtual.enabled: true       # Spring Boot 3.5: auto-configures virtual threads
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/ecommerce_orders
    username: ${DB_USER:ecommerce}
    password: ${DB_PASS:secret}
    hikari.maximum-pool-size: 20
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties.enable.idempotence: true
    consumer:
      group-id: order-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2.resourceserver.jwt:
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ecommerce}/protocol/openid-connect/certs
eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka/
management:
  endpoints.web.exposure.include: health, prometheus
