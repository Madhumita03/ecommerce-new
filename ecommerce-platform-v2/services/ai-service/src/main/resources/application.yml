server:
  port: 8087
spring:
  application:
    name: ai-service
    group: ecommerce-platform
  threads.virtual.enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-key}
      chat.options:
        model: gpt-4o
        temperature: 0.7
        max-tokens: 1000
    vectorstore.pgvector:
      initialize-schema: true
      dimensions: 1536
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/ecommerce_ai
    username: ${DB_USER:ecommerce}
    password: ${DB_PASS:secret}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka/
management:
  endpoints.web.exposure.include: health, prometheus
