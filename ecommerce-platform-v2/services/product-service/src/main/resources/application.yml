server:
  port: 8081

spring:
  application:
    name: product-service
    # Spring Boot 3.5: application group for structured logging
    group: ecommerce-platform

  # ── Structured logging (Spring Boot 3.5 native) ──────────────────────────
  logging:
    structured:
      format:
        console: ecs       # Elastic Common Schema JSON on prod profile
    level:
      root: INFO
      com.ecommerce: DEBUG

  # ── Datasource ──────────────────────────────────────────────────────────
  # NOTE: ShardingSphere 5.3+ no longer auto-registers from spring.shardingsphere.*
  # Spring Boot properties. For local dev we connect directly to a single
  # Postgres shard. To re-enable sharding in prod, set spring.datasource.url to
  # `jdbc:shardingsphere:classpath:sharding-config.yaml` and provide that file.
  datasource:
    url: jdbc:postgresql://${DB_PRIMARY0_HOST:localhost}:${DB_PORT:5432}/ecommerce_shard0
    username: ${DB_USER:ecommerce}
    password: ${DB_PASS:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate.ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

  security:
    oauth2.resourceserver.jwt:
      jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ecommerce}/protocol/openid-connect/certs

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka/
  instance.prefer-ip-address: true

management:
  endpoints.web.exposure.include: health, prometheus, info, caches
  prometheus.metrics.export.enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
